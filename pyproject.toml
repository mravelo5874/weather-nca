[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wnca"
version = "0.2.0"
description = "Probabilistic multi-variable weather neural cellular automaton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "xarray",
    "zarr",
    "gcsfs",
    "fsspec",
    "pyyaml",
    "matplotlib",
    "wandb",
    # scripts/animate.py imports this at module level to render MP4s; ffmpeg is not otherwise
    # on PATH on a fresh machine.
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "scoringrules",
]

[project.scripts]
wnca = "wnca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
