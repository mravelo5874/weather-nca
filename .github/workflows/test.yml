name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU torch: CI never trains, it only runs the unit suite.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # The 60s budget is a real constraint, not an aspiration: every phase runs `make test`
      # before it runs anything expensive, so a slow suite gets skipped and stops protecting us.
      - name: make test
        run: pytest tests/ -q --durations=10

      - name: smoke (synthetic, no network)
        run: |
          python -m wnca.cli train --smoke --set data.source='"synthetic"'
          python -m wnca.cli eval  --smoke --set data.source='"synthetic"'
