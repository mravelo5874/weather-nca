# Phase 2d-dilated -- the MINIMAL-DELTA locality control. Isolates: LOCALITY, and only that.
#
# ---------------------------------------------------------------------------------------
# WHY THIS EXISTS ALONGSIDE phase2d_control.yaml
#
# The GNN control changes four things at once against the NCA -- locality, iteration count
# (1 pass vs 20 sub-steps), weight sharing (6 distinct stacks vs one shared MLP), and input
# featurisation (the NCA is handed grad-x, grad-y and the Laplacian from fixed geometry; the
# GNN must infer differential structure from raw neighbour values). Worse, its receptive field
# was MEASURED (scripts/measure_reach.py) at 9 fine-mesh hops per window against the strictly
# local NCA's 20: the "non-local" arm moved information less far than the arm it controls for,
# at every available gnn_levels setting. A loss there is attributable to reach, not topology.
#
# This config changes exactly ONE thing against phase2c_full.yaml: perception gains a fifth
# group, the mean over the ring at exactly `perception_dilation` hops minus the centre. Same
# update MLP, same 20 sub-steps, same weight sharing, same free differential features, same
# optimizer, same data. Only how far each sub-step can see.
#
# ---------------------------------------------------------------------------------------
# THE TWO ARMS, AND WHY THEY ARE EXACTLY COMPARABLE
#
#   perception_dilation: 1   five groups; the ring at 1 hop carries NO extra reach
#   perception_dilation: 8   five groups; each sub-step reaches 8 hops
#
#   params, both arms   1,060,412        (phase 2c, four groups: 1,029,692)
#   measured reach      2 sub-steps x dilation, i.e. 20 vs 160 hops at n_substeps 20
#
# The arms are **parameter-identical**, so a difference between them is reach and nothing
# else. The ring is subsampled to a 6-neighbour fan-out -- the same as the local stencil -- so
# the extra operator is one sparse matmul of constant size whatever the radius, and unlike
# coarse-icosphere shortcuts it applies to every node uniformly.
#
# ---------------------------------------------------------------------------------------
# MEASURED PROPERTIES (scripts/measure_reach.py, and a timing probe)
#
#   params        dilation 1 and 8: 1,060,412 (identical) | phase 2c: 1,029,692 (+3.0%)
#   reach/window  dilation 1: 20 hops (= 2c) | dilation 8: 160 hops
#   mesh diameter ~93 hops, so dilation 8 is 1.7x the diameter -- effectively GLOBAL within a
#                 single 6 h window. This is deliberately the most generous non-local arm
#                 available, which is what makes a loss for it strong evidence.
#   wall-clock    dilation 1 and 8: 1.10x phase 2c per window, and identical to each other
#                 (1.097x vs 1.102x measured). So the d=1 vs d=8 comparison is matched on
#                 parameters AND compute; only the 2c reference carries the +10%.
#
# ---------------------------------------------------------------------------------------
# HOW TO READ THE RESULT
#
# The thesis is "a strictly local update rule is ENOUGH". The falsification test is to hand the
# model strictly more information and see whether it uses it. **The comparison that carries the
# result is d=8 vs d=1**, because those two arms differ in reach and nothing else -- same
# parameters, same compute, same everything. Phase 2c is a free reference point, not the
# control.
#
#   d=8 does not beat d=1  ->  locality was sufficient, at this data and budget.
#   d=8 beats d=1          ->  reach buys accuracy; locality is costing something.
#
# BOTH arms are run unconditionally. An earlier version gated d=1 on a d=8 win, on the argument
# that d=8's extra 3% of parameters made a d=8 loss "conservative". That argument was wrong: at
# fixed data and epochs more parameters can just as easily HURT -- 30,720 extra input weights to
# fit and one more channel the MLP must learn to ignore -- so the sign of that confound is
# unknown, not favourable. Gating d=1 would have left the thesis-CONFIRMING branch resting on an
# unverified assumption that the fifth group is neutral, which is the original 2d mistake in
# miniature.
#
# ---------------------------------------------------------------------------------------
# WHAT THIS STILL DOES NOT TEST
#
# * **The long-range channel is isotropic.** `mean(ring) - centre` is a scalar diffusion
#   operator; the local stencil additionally hands the model direction via grad-x and grad-y.
#   Composition with those local directional operators over 20 sub-steps recovers some
#   directionality, but strictly this asks "does isotropic long-range information help?" If d=8
#   loses, the honest headline is "locality sufficient relative to isotropic long-range
#   diffusion". A directional ring gradient -- grad-x/grad-y assembled over ring edges, two more
#   groups by the same construction -- is the natural follow-up.
# * **Where the threshold is.** d=8 is the far extreme. A d=8 win says reach matters but not at
#   what radius; d=2 (0.43x diameter) and d=4 (0.86x) would map the gradient of the effect and
#   stop a win-branch write-up implying that global attention is necessary.
#
phase: phase2d_dilated

# --- everything below is a verbatim mirror of configs/phase2c_full.yaml ---------------------
data:
  train_years: "1979-2017"
  val_years: [2018]
  test_years: [2020]

state:
  solar_forcing: true

model:
  hidden_dim: 512
  n_layers: 4
  n_substeps: 20
  dt: 0.05
  spectral_norm: true
  perception_dilation: 8         # <- THE ONLY DIFFERENCE. 1 for the parameter-matched control.

train:
  epochs: 8
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 500
  amp: true
  pushforward: true
  noise_std: 0.05
  ckpt_windows: 12
  ckpt_subsample: 0.25
  ckpt_every_steps: 2000
